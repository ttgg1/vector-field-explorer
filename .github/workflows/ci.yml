name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation drift
        run: python3 scripts/check-docs.py

  review-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check review records
        run: python3 scripts/check-review-records.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      # scripts/test.sh runs the suite and prunes stale hashed test binaries
      # before Swatinem/rust-cache saves target/ (ticket 34), keeping the cache
      # under GitHub's 10 GB limit. Do not add `cargo clean`: it empties the
      # cache the next job needs.
      - name: Test
        run: scripts/test.sh
      - name: Build (debug)
        run: cargo build

  # Shader parse / device-init errors only appear at runtime, so actually
  # launch the app on a headless X server with software Vulkan (lavapipe).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # winit dlopens libxkbcommon-x11.so.0 at startup; it is not pulled in by
      # xvfb or Mesa, so the app panics before any wgpu work without it.
      - name: Install Xvfb + software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libxkbcommon-x11-0
      - name: Runtime smoke test
        run: xvfb-run -a env WGPU_BACKEND=vulkan scripts/smoke-run.sh 20

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk 0.22.1
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1
      - name: Check the WebGPU bootstrap gate
        run: scripts/check-web-bootstrap.sh
      - name: Check and build the browser target
        run: scripts/test-web.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build (all targets)
        run: cargo build --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
