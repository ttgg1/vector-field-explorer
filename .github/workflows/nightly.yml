name: Nightly

# Rolling nightly prerelease (ticket 42).
#
# Every day at 03:17 UTC (and on demand) this workflow verifies main, builds the
# same four assets as the tag-driven release through the shared
# `.github/workflows/package.yml`, and moves the single `nightly` tag to the
# built commit. It never creates a `v*` tag or release; `nightly` is always a
# prerelease and is never marked "latest".
#
# Failure behaviour: the release job needs verify *and* build, so a failing
# test, lint or build publishes nothing and the previous nightly stays intact.
# Inside the release job the tag is the *last* thing to move: assets are
# uploaded, stale assets deleted and the title/notes updated while `nightly`
# still points at the previous commit. A first nightly is created as a draft
# and published only after its assets are attached, so a failure leaves the
# draft unpublished (the job also deletes it) rather than a public release with
# missing binaries.
#
# Cost ruling (controller, ticket 42 review): both macOS targets stay on the
# daily schedule. The repository becomes public before v0.1.0, where macOS
# minutes are free; until then the private-repo cost (10x) is accepted and will
# be revisited only if billing becomes material. Do not gate macOS on
# `workflow_dispatch` without a new ruling.
#
# The tag push uses the job's `contents: write` token. GITHUB_TOKEN pushes do
# not trigger other workflows, and release.yml only listens for `v*` tags, so
# moving `nightly` can never start a versioned release.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One nightly at a time. Never cancel a run in progress: the release job moves a
# shared tag, so a half-finished run must not race the next one.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  verify:
    name: Verify main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.nightly.outputs.version }}
      sha: ${{ steps.nightly.outputs.sha }}
      display_date: ${{ steps.nightly.outputs.display_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # full history for the origin/main comparison

      - name: Require the current origin/main head
        run: |
          set -euo pipefail
          git fetch --no-tags origin "main:refs/remotes/origin/main"
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::nightly builds run from main, not ${GITHUB_REF}"
            exit 1
          fi
          head="$(git rev-parse HEAD)"
          main="$(git rev-parse refs/remotes/origin/main)"
          if [ "$head" != "$main" ]; then
            echo "::error::checked out ${head}, but origin/main is ${main}; re-run on the main head"
            exit 1
          fi

      - name: Compute nightly version
        id: nightly
        run: |
          set -euo pipefail
          base="$(scripts/crate-version.sh)"
          sha="$(git rev-parse HEAD)"
          # One clock read: the version date and the display date in the title
          # must agree even if the job crosses midnight UTC.
          day="$(date -u +%Y%m%d)"
          version="$(scripts/nightly-version.sh "$base" "$day" "$sha")"
          display_date="${day:0:4}-${day:4:2}-${day:6:2}"
          echo "nightly version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "display_date=${display_date}" >> "$GITHUB_OUTPUT"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build (all targets)
        run: cargo build --all-targets

      # scripts/test.sh also prunes stale test binaries before the cache saves
      # target/, keeping the cache under GitHub's 10 GB limit (ticket 34).
      - name: Test
        run: scripts/test.sh

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Package
    needs: verify
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      ref: ${{ needs.verify.outputs.sha }}
      build-version: ${{ needs.verify.outputs.version }}

  release:
    name: Publish nightly
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `contents: write` lives here and only here: verify and build are read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          SHA: ${{ needs.verify.outputs.sha }}
          NIGHTLY_DATE: ${{ needs.verify.outputs.display_date }}
        run: |
          set -euo pipefail
          tag=nightly

          case "$SHA" in
            ''|*[!0-9a-f]*)
              echo "::error::not a full commit SHA: '${SHA}'"
              exit 1
              ;;
          esac

          shopt -s nullglob
          assets=(dist/*)
          if [ "${#assets[@]}" -ne 4 ]; then
            echo "::error::expected 4 nightly assets, found ${#assets[@]}: ${assets[*]}"
            exit 1
          fi
          ls -l dist

          cat > release-notes.md <<NOTES
          ### Nightly build

          Built from \`main\` at \`${SHA}\` (version \`${VERSION}\`). This is a
          rolling prerelease: assets are rebuilt daily and the \`nightly\` tag
          moves to the newest verified \`main\` commit.

          ### macOS: first launch

          These builds are unsigned and not notarized. On macOS 15 (Sequoia)
          and later, the first launch is blocked; approve it in System Settings
          -> Privacy & Security, then choose "Open Anyway". On older macOS,
          right-click (or Control-click) \`vector-field-explorer.app\` and choose
          **Open**.

          ### Linux: AppImage

          Download the AppImage, make it executable
          (\`chmod +x vector-field-explorer-*-x86_64-unknown-linux-gnu.AppImage\`)
          and run it. It needs a Vulkan-capable driver (or a software
          implementation such as \`mesa-vulkan-drivers\`). The AppImage uses the
          host GPU driver and does not bundle Mesa.

          If FUSE 2 is unavailable (for example Ubuntu 22.04+ without
          \`libfuse2\`), run it with \`--appimage-extract-and-run\`, or install
          \`libfuse2\`.

          ### Windows: first launch

          Download the Windows \`.zip\`, extract it, and run
          \`vector-field-explorer.exe\`. The build is unsigned by design and no
          installer is provided. Windows SmartScreen may show "Windows protected
          your PC": choose **More info**, then **Run anyway**.
          NOTES

          # A first nightly is a draft: the public release (and its tag) appears
          # only when the assets are already attached. If anything fails before
          # the publish, remove the draft so it can never become the nightly.
          draft_created=0
          published=0
          cleanup_draft() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && [ "$draft_created" -eq 1 ] && [ "$published" -eq 0 ]; then
              echo "::warning::deleting the unpublished nightly draft after a failure"
              gh release delete "$tag" --yes || true
            fi
            exit "$status"
          }
          trap cleanup_draft EXIT

          # A draft left behind by an earlier failed run is removed, not
          # treated as the live nightly: it must never become public without
          # this run's assets.
          existing=0
          case "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)" in
            false) existing=1 ;;
            true)
              echo "removing a draft left by an earlier failed run"
              gh release delete "$tag" --yes
              ;;
          esac

          if [ "$existing" -eq 1 ]; then
            echo "release ${tag} exists; replacing assets before the tag moves"

            # Upload first, then drop assets from older nightlies: each run
            # replaces the set, and a failed upload leaves the previous set
            # whole.
            gh release upload "$tag" "${assets[@]}" --clobber

            declare -A keep=()
            for asset in "${assets[@]}"; do
              keep["$(basename "$asset")"]=1
            done
            # Capture the list first: a failing `gh release view` inside a
            # process substitution would end the loop silently under
            # `set -e` and leave stale assets behind.
            asset_names="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              if [ -z "${keep[$name]:-}" ]; then
                echo "removing stale asset ${name}"
                gh release delete-asset "$tag" "$name" --yes
              fi
            done <<< "$asset_names"

            gh release edit "$tag" \
              --title "Nightly ${NIGHTLY_DATE}" \
              --prerelease \
              --latest=false \
              --notes-file release-notes.md
          else
            echo "release ${tag} does not exist; creating a draft"
            gh release create "$tag" \
              --draft \
              --target "$SHA" \
              --title "Nightly ${NIGHTLY_DATE}" \
              --prerelease \
              --latest=false \
              --notes-file release-notes.md
            draft_created=1

            gh release upload "$tag" "${assets[@]}" --clobber

            # Publishing creates the tag at --target, so the public nightly
            # appears only once its assets are in place.
            gh release edit "$tag" \
              --draft=false \
              --title "Nightly ${NIGHTLY_DATE}" \
              --prerelease \
              --latest=false \
              --notes-file release-notes.md
            published=1
          fi

          # Last: point the rolling tag at the commit whose assets are live. In
          # the draft path publish normally creates it already; the force push
          # also covers a tag that outlived a deleted release.
          git tag -f nightly "$SHA"
          git push --force origin refs/tags/nightly

      - name: Verify the nightly tag points at the built commit
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          # Read the tag back from the remote rather than trusting the push.
          git fetch --force --no-tags origin '+refs/tags/nightly:refs/tags/nightly-verify'
          actual="$(git rev-parse 'refs/tags/nightly-verify^{commit}')"
          if [ "$actual" != "$SHA" ]; then
            echo "::error::nightly points at ${actual}, expected ${SHA}"
            exit 1
          fi
          echo "nightly -> ${actual}"
