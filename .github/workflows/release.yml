name: Release

# Tag-driven release pipeline (ticket 17).
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Jobs:
#   verify   ubuntu-latest  guards + build/test/clippy; everything else waits
#   build    package.yml    reusable workflow: one asset per target (shared
#                           with nightly.yml, ticket 42)
#   release  ubuntu-latest  create/update the GitHub Release, attach all assets
#
# Guards, both before anything is built or published:
#   * the tag must be `v` + the Cargo.toml [package] version (v0.1.0)
#   * the tag commit must be reachable from main
#
# macOS builds are unsigned and not notarized in v1. On macOS 15 (Sequoia) and
# later, approve the first launch in System Settings -> Privacy & Security ->
# "Open Anyway"; on older macOS, right-click (or Control-click) the .app and
# choose Open. That note is prepended to every release's generated notes.
#
# A semver pre-release tag (v0.1.0-rc.1) is published with --prerelease, so a
# test tag does not become the "latest" release.
#
# workflow_dispatch takes the tag to release and a `publish` flag: with
# publish=false the run still verifies and builds all four assets (useful as
# a dry run) but skips the release job.
#
# Runner images: the ticket named macos-13 for x86_64, but that image was
# retired in Dec 2025 and macos-14 followed on 2026-11-02. The matrix therefore
# uses macos-15-intel (the last Intel image, supported through Aug 2027) and
# macos-15 (arm64); targets and asset names are unchanged.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example v0.1.0)'
        required: true
        type: string
      publish:
        description: 'Publish a GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  # Tag pushes expose the tag as github.ref_name; a manual run takes an input.
  TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build and verify the tagged commit, not the branch head that a
          # manual dispatch would otherwise check out.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0 # full history and tags for the main-reachability check

      - name: Check tag matches Cargo.toml version
        id: version
        run: |
          version="$(scripts/check-version.sh "$TAG")"
          echo "release version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check tag is reachable from main
        run: |
          set -euo pipefail
          git fetch --no-tags origin "main:refs/remotes/origin/main"
          git fetch --no-tags origin --force "refs/tags/${TAG}:refs/tags/${TAG}"
          if ! git merge-base --is-ancestor "refs/tags/${TAG}^{commit}" refs/remotes/origin/main; then
            echo "::error::tag ${TAG} is not reachable from main; refusing to release"
            exit 1
          fi

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build (all targets)
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Package
    needs: verify
    # Shared with nightly.yml: same targets, same archive layouts (ticket 42).
    # A versioned release leaves build-version empty, so the app reports the
    # Cargo.toml version.
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

  release:
    name: Publish release
    needs: [verify, build]
    # Tag pushes always publish. A manual run is a dry run unless publish is
    # true: verify and all four builds still run and upload their assets.
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          assets=(dist/*)
          if [ "${#assets[@]}" -ne 4 ]; then
            echo "::error::expected 4 release assets, found ${#assets[@]}: ${assets[*]}"
            exit 1
          fi
          ls -l dist

          # Prepended to the commit-generated notes by `gh release create`.
          cat > release-notes.md <<'NOTES'
          ### macOS: first launch

          These builds are unsigned and not notarized. On macOS 15 (Sequoia)
          and later, the first launch is blocked; approve it in System Settings
          -> Privacy & Security, then choose "Open Anyway". On older macOS,
          right-click (or Control-click) `vector-field-explorer.app` and choose
          **Open**.

          ### Linux: AppImage

          Download the `x86_64-unknown-linux-gnu.AppImage`, make it executable
          and run it:

          ```sh
          chmod +x vector-field-explorer-*-x86_64-unknown-linux-gnu.AppImage
          ./vector-field-explorer-*-x86_64-unknown-linux-gnu.AppImage
          ```

          It needs a Vulkan-capable driver (or a software implementation such
          as `mesa-vulkan-drivers`). The AppImage uses the host GPU driver and
          does not bundle Mesa.

          If FUSE 2 is unavailable (for example Ubuntu 22.04+ without
          `libfuse2`), run it with `--appimage-extract-and-run`, or install
          `libfuse2`.

          ### Windows: first launch

          Download `vector-field-explorer-<version>-x86_64-pc-windows-msvc.zip`,
          extract it, and run `vector-field-explorer.exe`. The build is
          unsigned by design and no installer is provided. Windows SmartScreen
          may show "Windows protected your PC": choose **More info**, then
          **Run anyway**. The archive also contains `README.md`, `LICENSE`,
          `THIRD_PARTY_LICENSES.md`, and `THIRD_PARTY_NOTICES.txt`.
          NOTES

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; uploading assets with --clobber"
          else
            # semver pre-release tags must not become the "latest" release.
            prerelease=()
            case "$TAG" in
              v*-*) prerelease+=(--prerelease) ;;
            esac
            gh release create "$TAG" \
              --title "$TAG" \
              --verify-tag \
              --generate-notes \
              "${prerelease[@]}" \
              --notes "$(cat release-notes.md)"
          fi

          gh release upload "$TAG" "${assets[@]}" --clobber
