name: Package

# Reusable packaging pipeline (ticket 42), shared by release.yml (ticket 17)
# and nightly.yml so a versioned release and a nightly are built and laid out
# by exactly one copy of the steps.
#
# The caller owns verification, versioning and publishing. This workflow only:
#   * checks out the requested ref,
#   * builds the three supported targets in release mode,
#   * strips the binary, packages it (a single-file AppImage on Linux,
#     .app.zip on macOS) and uploads one artifact per target under the target
#     triple's name.
#
# Linux AppImage (ticket 43):
#   * linuxdeploy 1-alpha-20251107-1 builds the AppDir; appimagetool 1.9.1
#     turns it into the image using the pinned type2 runtime 20251108. All
#     three downloads are pinned by URL and SHA-256 in the "Install Linux
#     AppImage tools" step, and the tools run with
#     --appimage-extract-and-run because GitHub runners have no FUSE.
#   * The bundle carries the app and its non-graphics dependencies only. The
#     Vulkan loader/ICD, GL/EGL, DRM and GBM userspace libraries are excluded
#     so the AppImage uses the host GPU driver instead of shipping (or
#     shadowing) Mesa. The packaging step fails if one slips in.
#   * packaging/linux/vector-field-explorer.svg is the icon source; the
#     committed 256x256 PNG beside it is rendered from that SVG, so CI needs no
#     SVG converter and linuxdeploy always gets the raster icon AppImage
#     tooling expects.
#
# Inputs:
#   version        version used in asset names and Info.plist
#   ref            tag name or commit SHA to build
#   build-version  compile-time VFE_BUILD_VERSION; empty means the app falls
#                  back to the Cargo.toml version (src/version.rs)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version used in asset names and Info.plist'
        required: true
        type: string
      ref:
        description: 'Tag or commit SHA to build'
        required: true
        type: string
      build-version:
        description: 'Compile-time VFE_BUILD_VERSION (empty = Cargo.toml version)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    # macOS minutes bill at 10x on private repos; cap a hung build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Build-only deps: winit/glutin headers, X11/Wayland, GL and Vulkan.
      # file and patchelf are used by linuxdeploy to identify and rewire the
      # ELF files it deploys.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libgl1-mesa-dev libvulkan-dev pkg-config file patchelf

      - name: Build (release)
        env:
          # Nightly builds stamp their full version; a versioned release passes
          # an empty value and the app falls back to the Cargo.toml version.
          VFE_BUILD_VERSION: ${{ inputs.build-version }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/vector-field-explorer"
          if [ "$RUNNER_OS" = "macOS" ]; then
            strip -x "$bin"
          else
            strip "$bin"
          fi

      # Both tools are AppImages themselves. --appimage-extract-and-run keeps
      # them working on runners without FUSE. Pinning the release tag and the
      # SHA-256 keeps a moving "continuous" build out of released artifacts.
      - name: Install Linux AppImage tools
        if: runner.os == 'Linux'
        env:
          LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          # appimagetool otherwise downloads this from the "continuous" tag,
          # which would make released images non-reproducible.
          APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/appimage-tools"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/linuxdeploy.AppImage" "$LINUXDEPLOY_URL"
          curl -fsSL --retry 3 -o "$tools/appimagetool.AppImage" "$APPIMAGETOOL_URL"
          curl -fsSL --retry 3 -o "$tools/runtime-x86_64" "$APPIMAGE_RUNTIME_URL"
          echo "${LINUXDEPLOY_SHA256}  $tools/linuxdeploy.AppImage" | sha256sum -c -
          echo "${APPIMAGETOOL_SHA256}  $tools/appimagetool.AppImage" | sha256sum -c -
          echo "${APPIMAGE_RUNTIME_SHA256}  $tools/runtime-x86_64" | sha256sum -c -
          chmod +x "$tools/linuxdeploy.AppImage" "$tools/appimagetool.AppImage" \
            "$tools/runtime-x86_64"
          {
            echo "LINUXDEPLOY=$tools/linuxdeploy.AppImage"
            echo "APPIMAGETOOL=$tools/appimagetool.AppImage"
            echo "APPIMAGE_RUNTIME=$tools/runtime-x86_64"
          } >> "$GITHUB_ENV"

      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for f in README.md LICENSE; do
            if [ ! -f "$f" ]; then
              echo "::error::release assets require $f in the repo root"
              exit 1
            fi
          done

          name="vector-field-explorer-${VERSION}-${TARGET}"
          bin="target/${TARGET}/release/vector-field-explorer"
          mkdir -p dist

          if [ "$RUNNER_OS" = "Linux" ]; then
            appdir="dist/AppDir"
            "$LINUXDEPLOY" --appimage-extract-and-run \
              --appdir "$appdir" \
              --executable "$bin" \
              --desktop-file packaging/linux/vector-field-explorer.desktop \
              --icon-file packaging/linux/vector-field-explorer-256.png \
              --icon-filename vector-field-explorer \
              --exclude-library 'libvulkan*' \
              --exclude-library 'libGL*' \
              --exclude-library 'libEGL*' \
              --exclude-library 'libOpenGL*' \
              --exclude-library 'libdrm*' \
              --exclude-library 'libgbm*'

            # linuxdeploy owns usr/bin, usr/lib, usr/share/applications,
            # usr/share/icons and AppRun; docs are added afterwards so nothing
            # in the tool run can overwrite them.
            install -Dm644 README.md \
              "${appdir}/usr/share/doc/vector-field-explorer/README.md"
            install -Dm644 LICENSE \
              "${appdir}/usr/share/doc/vector-field-explorer/LICENSE"

            asset="dist/${name}.AppImage"
            # No update information: v1 has no auto-update (out of scope), and
            # --no-appstream avoids requiring AppStream metadata.
            ARCH=x86_64 VERSION="$VERSION" \
              "$APPIMAGETOOL" --appimage-extract-and-run --no-appstream \
              --runtime-file "$APPIMAGE_RUNTIME" \
              "$appdir" "$asset"

            # Validate the published file itself, not just the AppDir.
            if [ ! -s "$asset" ]; then
              echo "::error::${asset} is missing or empty"
              exit 1
            fi
            if [ ! -x "$asset" ]; then
              echo "::error::${asset} is not marked executable"
              exit 1
            fi
            asset_abs="$(realpath "$asset")"
            extract="$(mktemp -d)"
            ( cd "$extract" && "$asset_abs" --appimage-extract >/dev/null )
            root="${extract}/squashfs-root"
            for required in \
              AppRun \
              usr/bin/vector-field-explorer \
              usr/share/applications/vector-field-explorer.desktop \
              usr/share/icons/hicolor/256x256/apps/vector-field-explorer.png \
              usr/share/doc/vector-field-explorer/README.md \
              usr/share/doc/vector-field-explorer/LICENSE; do
              if [ ! -e "${root}/${required}" ]; then
                echo "::error::AppImage is missing ${required}"
                exit 1
              fi
            done
            if [ ! -x "${root}/usr/bin/vector-field-explorer" ]; then
              echo "::error::AppImage binary is not executable"
              exit 1
            fi
            # Host GPU userspace must stay on the host (ticket 43).
            if [ -d "${root}/usr/lib" ]; then
              bundled="$(find "${root}/usr/lib" -maxdepth 1 \
                \( -type f -o -type l \) \
                \( -name 'libvulkan*' -o -name 'libGL*' -o -name 'libEGL*' \
                   -o -name 'libOpenGL*' -o -name 'libdrm*' \
                   -o -name 'libgbm*' \) -printf '%f ')"
              if [ -n "$bundled" ]; then
                echo "::error::AppImage bundles host GPU libraries: ${bundled}"
                exit 1
              fi
            fi
            rm -rf "$extract"
            file "$asset"
            echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          else
            app="dist/vector-field-explorer.app"
            mkdir -p "${app}/Contents/MacOS"
            cp "$bin" "${app}/Contents/MacOS/vector-field-explorer"
            cat > "${app}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Vector Field Explorer</string>
            <key>CFBundleDisplayName</key>
            <string>Vector Field Explorer</string>
            <key>CFBundleIdentifier</key>
            <string>io.github.ttgg1.vector-field-explorer</string>
            <key>CFBundleExecutable</key>
            <string>vector-field-explorer</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
            cp README.md LICENSE dist/
            ( cd dist && zip -q -r "../${name}.zip" vector-field-explorer.app README.md LICENSE )
            echo "asset=${name}.zip" >> "$GITHUB_OUTPUT"
          fi

          ls -l dist

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error
