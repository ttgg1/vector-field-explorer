name: Pages

# Ticket 16a: publish the wasm build and the static native-download page to
# https://ttgg1.github.io/vector-field-explorer/. The push trigger is main-only;
# a manual `workflow_dispatch` can be started from any branch, so both jobs pin
# `github.ref == 'refs/heads/main'` and a dispatch from a feature branch skips
# both jobs.
#
# Pages is disabled by default: both jobs are additionally guarded by
# `vars.PAGES_ENABLED == 'true'`, so the workflow stays green on `main` until
# ticket 16b enables Pages (no `github-pages` environment exists yet). Keep
# `workflow_dispatch` main-only; do not enable Pages or change visibility here.
#
# Before the artifact is uploaded, a gate step requires a non-prerelease `v*`
# GitHub release to exist (`gh release view ... --json isPrerelease,tagName`,
# `isPrerelease == false`), so the download CTAs never ship dead. The site
# checker validates the rest of the artifact.
#
# Once the `github-pages` environment exists, restrict its deployment branches
# and tags to `main` as defense in depth.
#
# Do not add a `pull_request` trigger: a fork could not read the deployment
# secrets, and this workflow only produces the production site.

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'index.html'
      - 'Trunk.toml'
      - 'web/**'
      - 'site/**'
      - 'docs/images/**'
      - 'scripts/check-site.sh'
      - 'scripts/check_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# `contents: read` is required by actions/checkout now that the workflow sets
# explicit permissions; without it checkout cannot read the repository.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A manual dispatch can select any ref; only main is deployable. Pages is
    # additionally gated on vars.PAGES_ENABLED so the workflow stays green
    # until ticket 16b enables Pages.
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown
      # Same Trunk pin as .github/workflows/ci.yml and scripts/test-web.sh.
      - name: Install Trunk 0.22.1
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1
      - name: Configure Pages
        uses: actions/configure-pages@v6
      # The project site lives under /vector-field-explorer/, so the base path
      # must be explicit; Trunk.toml does not set a competing public_url.
      - name: Build the browser app
        run: trunk build --release --public-url /vector-field-explorer/
      - name: Stage the download page
        run: |
          set -euo pipefail
          install -Dm644 site/download.html dist/download.html
          install -Dm644 site/style.css dist/style.css
          install -Dm644 docs/images/vector-field-explorer.png \
            dist/screenshots/vector-field-explorer.png
      - name: Check the site artifact
        run: scripts/check-site.sh
      - name: Require a non-prerelease v* release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh release view --repo "$GITHUB_REPOSITORY" --json isPrerelease,tagName)"
          printf '%s\n' "$release"
          parsed="$(printf '%s' "$release" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(("true" if d.get("isPrerelease") else "false") + " " + str(d.get("tagName","")))' )"
          is_prerelease="${parsed%% *}"
          tag_name="${parsed#* }"
          if [[ "$tag_name" != v* ]]; then
            echo "::error::latest release '$tag_name' is not a v* release" >&2
            exit 1
          fi
          if [[ "$is_prerelease" == "true" ]]; then
            echo "::error::latest release '$tag_name' is a prerelease; refusing to ship download CTAs" >&2
            exit 1
          fi
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # Same main-only and Pages-enablement guards as build; the environment
    # should also be restricted to main once it exists.
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
