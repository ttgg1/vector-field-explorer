[package]
name = "vector-field-explorer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/ttgg1/vector-field-explorer"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "persistence", "wayland", "x11", "accesskit", "system_fonts"] }

glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
meval = "0.2"
colorous = "1"
dirs-next = "2.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
image = "0.25"
rfd = "0.15"
once_cell = "1.19"
log = "0.4"

# Ticket 20: standard sinks only. Native logs to stderr with `RUST_LOG`
# (default `info`); wasm logs to the browser console via `console_log`
# (initialized in ticket 16's entry point).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_log = "1"
