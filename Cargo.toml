[package]
name = "vector-field-explorer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/ttgg1/vector-field-explorer"
# Ticket 21: `tests/suite.rs` is the single integration-test harness; every
# `tests/*_test.rs` is a module of it except the isolated `[[test]]` targets
# below. One process runs the whole suite (instead of 54 processes paying
# startup and getting no cross-suite parallelism), and a lib change recompiles
# one test crate instead of 54. A test that mutates process-global environment
# must stay its own `[[test]]` target so it runs in an isolated process; see
# `config_test`.
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "persistence", "wayland", "x11", "accesskit", "system_fonts"] }

glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
meval = "0.2"
colorous = "1"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
once_cell = "1.19"
log = "0.4"

[dev-dependencies]
tempfile = "3.10"

[[test]]
name = "suite"
path = "tests/suite.rs"

# `unsafe { std::env::set_var }` requires that no other thread can observe the
# mutation, so this test runs in its own process instead of the shared suite.
[[test]]
name = "config_test"
path = "tests/config_test.rs"

# Ticket 21: the math-heavy integration tests (particles, streamlines, sampling)
# are dominated by unoptimized arithmetic. `profile.test` inherits dev's
# `debug = 1` / `strip = "debuginfo"` from `.cargo/config.toml`; raising only
# the optimization level keeps backtraces and the compile cost of debug info
# unchanged.
[profile.test]
opt-level = 2

# Ticket 20: standard sinks only. Native logs to stderr with `RUST_LOG`
# (default `info`); wasm logs to the browser console via `console_log`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs-next = "2.0"
env_logger = "0.11"
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
  "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Navigator",
  "Gpu", "GpuAdapter", "GpuRequestAdapterOptions", "Location", "Storage",
] }
web-time = "1"
console_log = "1"
