[package]
name = "vector-field-explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "persistence", "wayland", "x11", "accesskit", "system_fonts"] }

glam = "0.30"
meval = "0.2"
colorous = "1"
dirs-next = "2.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
image = "0.25"
once_cell = "1.19"
