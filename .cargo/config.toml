# Build throughput tuning for this repo (2026-11-08).
#
# `--all-targets` links ~18 test binaries at once. With full debug info each
# binary is 200-400 MB, and parallel `ld.lld` writes saturate the disk before
# they saturate the CPU. Line-tables-only debug info cuts that write volume
# sharply. Jobs are capped at 10 so several parallel agents/worktrees each get
# compute; do not raise this without a ledger ruling.
[build]
jobs = 10

[profile.dev]
debug = 1
